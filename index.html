<style>
:root{--ink:#20283b;--muted:#5f6679;--green:#2f9e3a;--green-d:#23802d;--lime:#b5d913;--pink:#ff79d0;--pink-d:#e8509f;--pink-l:#ffeff7;--blue:#4caeff;--violet:#8c83ff;--yellow:#ffc833;--round:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Arial Rounded MT Bold","Yu Gothic UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--latin:"Trebuchet MS","Avenir Next","Segoe UI",Arial,sans-serif;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}

.stripe{height:8px;background:repeating-linear-gradient(115deg,var(--green) 0 34px,var(--lime) 34px 52px,#fff 52px 58px,var(--pink) 58px 92px,var(--yellow) 92px 110px,#fff 110px 116px,var(--blue) 116px 150px,#fff 150px 156px)}
header{position:relative;background:linear-gradient(100deg,#2f9e3a,#3cb032 45%,#8ccb1e);color:#fff;overflow:hidden;box-shadow:0 6px 18px #2f9e3a33}
header:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff14 0 22px,transparent 22px 60px)}
.head{position:relative;max-width:1080px;margin:auto;padding:44px 28px 48px;display:flex;gap:20px;align-items:center}
.icon{display:grid;place-items:center;background:#fff;width:72px;height:72px;border-radius:50%;box-shadow:0 5px 0 #1f7a2a,0 10px 22px #0003;flex-shrink:0}.icon svg{width:46px;height:46px}
small.en{display:block;font:italic 800 12px/1.4 var(--latin);letter-spacing:3px;color:#f1ffe0}
h1{font-family:var(--round);font-size:34px;margin:2px 0 4px;font-weight:900;letter-spacing:2px;text-shadow:0 3px 0 #1f7a2a}
.head p{margin:0;font-size:14px;color:#f3ffe8}
main{flex:1;width:100%;max-width:1080px;margin:auto;padding:36px 28px}
.tag{display:inline-block;font:italic 900 14px var(--latin);letter-spacing:1.5px;color:#fff;background:var(--pink-d);padding:4px 22px 4px 16px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);margin-bottom:18px}
.tag span{font:900 13px var(--round);margin-left:8px;letter-spacing:0;font-style:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{position:relative;display:block;text-decoration:none;color:var(--ink);background:#fff;border:3px solid #c9ecc2;border-radius:22px;padding:26px 24px 22px;box-shadow:7px 7px 0 #e1f4dc,0 12px 28px #4b3d8a12;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(115deg,var(--green) 0 24px,var(--lime) 24px 36px,var(--pink) 36px 60px,var(--yellow) 60px 72px)}
.card:hover{transform:translateY(-4px);box-shadow:9px 11px 0 #e1f4dc,0 16px 32px #4b3d8a1c}
.card:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
.num{display:inline-grid;place-items:center;min-width:40px;height:40px;border-radius:999px;background:var(--green);color:#fff;font:italic 900 16px var(--latin);box-shadow:0 3px 0 #0002,inset 0 -3px 0 #0002}
.card h2{font-family:var(--round);font-size:22px;font-weight:900;margin:14px 0 6px}
.card p{margin:0 0 16px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.chips span{font-size:12px;font-weight:700;color:var(--green-d);background:#f1faee;border:2px solid #d5eecf;border-radius:999px;padding:1px 10px}
.go{display:inline-block;background:linear-gradient(90deg,var(--pink-d),var(--pink));color:#fff;font-weight:900;border-radius:999px;padding:8px 22px;box-shadow:0 4px 0 #c43c86}
.soon{border-style:dashed;border-color:#ddd7ee;box-shadow:none;background:#ffffffb0;color:var(--muted);display:grid;place-items:center;text-align:center;min-height:200px}.soon:before{display:none}.soon:hover{transform:none;box-shadow:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 40px}footer .stripe{max-width:420px;margin:10px auto 18px;border-radius:999px;height:6px}footer p{margin:4px 0}
@media(max-width:600px){.head{padding:30px 18px 34px;gap:14px}.icon{width:56px;height:56px}.icon svg{width:36px;height:36px}h1{font-size:26px}small.en{font-size:10px;letter-spacing:2px}main{padding:26px 16px}.grid{grid-template-columns:1fr;gap:18px}}
</style></head>
