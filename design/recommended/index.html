<html lang="zh-Hant"><head><meta name="recommended-build" content="20261008-outfit-1"><script>
(() => {
  const build=document.querySelector('meta[name="recommended-build"]').content;
  let checking=false;
  async function checkVersion(){
    if(checking||!/^https?:$/.test(location.protocol))return;
    checking=true;
    try{
      const url=new URL('./',location.href);
      url.searchParams.set('_check',Date.now());
      const response=await fetch(url,{cache:'no-store'});
      if(!response.ok)return;
      const doc=new DOMParser().parseFromString(await response.text(),'text/html');
      const latest=doc.querySelector('meta[name="recommended-build"]')?.content;
      if(latest&&latest!==build){
        const target=new URL(location.href);
        // Keep the selected race/job while bypassing the cached entry document.
        target.searchParams.set('_version',latest);
        location.replace(target.href);
      }
    }catch(_){/* Keep the existing page usable when offline. */}
    finally{checking=false;}
  }
  checkVersion();
  window.addEventListener('pageshow',event=>{if(event.persisted)checkVersion();});
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>繁中推荐作业区 · 種馬設計圖</title><meta name="description" content="按賽事與跑法選擇站長整理的推薦戰馬與種馬作業。"><link rel="stylesheet" href="../_astro/index.Cx1QAUdY.css"><link rel="stylesheet" href="style.css?v=26"></head>
